<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurnEngine - Chess Validator</title>
    <!-- Use a modern Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="glow-title">TurnEngine</h1>
            <p class="subtitle">Concurrent Chess Engine</p>
        </header>

        <main class="dashboard">
            <!-- Left Side: Controls & Board -->
            <section class="game-section glass-panel">
                
                <div class="board-container">
                    <!-- Futuristic Chess-Style 8x8 Grid (Generated by JS) -->
                    <div id="chessBoard" class="chess-board-wrapper">
                    </div>
                </div>

                <div class="controls">
                    <button class="btn action-btn" id="btnInteractive">Interactive Game</button>
                    <button class="btn action-btn" id="btnRace">Race Condition Demo</button>
                    <button class="btn action-btn" id="btnSemaphore">Semaphore Demo</button>
                    <button class="btn action-btn" id="btnSimulation">20-Move Simulation</button>
                </div>
            </section>

            <!-- Right Side: Logs / Output -->
            <aside class="log-panel glass-panel">
                <div class="log-header">
                    <h2>Engine Output</h2>
                    <span class="status-indicator"></span>
                </div>
                <div class="log-content" id="logContent">
                    <!-- Activity Feed Cards will be injected here dynamically -->
                    <div class="activity-card system">
                        <span class="activity-icon">⚙️</span>
                        <span class="activity-text">System initialized. Select a mode from the control panel to begin.</span>
                    </div>
                </div>
            </aside>
        </main>
        
        <footer>
            <p>&copy; 2026 TurnEngine. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
